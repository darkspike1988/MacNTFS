name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Run Tests
        run: swift test --verbose

      - name: Build Release Binary
        run: swift build -c release
