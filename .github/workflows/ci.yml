name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Unit tests, the command line tests and the read-only checks need no reference images.
  unit:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests (without the reference corpus)
        run: swift test --skip CorpusTests

      - name: Read-only guarantee of the command line tool
        run: scripts/readonly-check.sh .build/debug/macntfs Tests/Fixtures/mini.img

      - name: The release binary has no call that can change files
        run: |
          swift build -c release
          banned='_(pwrite|pwritev|write|writev|ftruncate|truncate|unlink|unlinkat|rename|renameat|mkdir|rmdir|link|symlink|chmod|fchmod|chown|fchown|utimes|futimes|fsync|fcntl|mmap)$'
          if nm -u .build/release/macntfs | grep -E "$banned"; then
            echo "The release binary imports a call that can change files" >&2
            exit 1
          fi

  # The reference images are written by ntfs-3g and by the Linux kernel driver ntfs3 in a Linux container
  # and checked by ntfs-3g and The Sleuth Kit before the Swift tests compare the engine with them.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build the reference images
        run: scripts/corpus/build.sh

      - name: Cross-check the manifests with two other readers
        run: scripts/corpus/verify.sh

      - name: Keep the images for the comparison job
        uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: Tests/Corpus/out
          retention-days: 7

  compare:
    needs: corpus
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get the reference images
        uses: actions/download-artifact@v4
        with:
          name: corpus
          path: Tests/Corpus/out

      - name: Compare the engine with every image
        env:
          # 16 images written by ntfs-3g and 2 committed fixtures. The two images of the kernel
          # driver ntfs3 (k-*) are not built here: the runner kernel cannot load the module.
          # They are checked on a developer machine. With fewer than 18 images the test fails
          # instead of passing on what is left.
          MACNTFS_CORPUS_REQUIRE: "18"
        run: swift test --filter CorpusTests

  # The engine builds and passes its tests on Linux too, and a coverage-guided fuzzer
  # (libFuzzer with AddressSanitizer) opens damaged copies of the committed images.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:5.10-jammy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Run tests (without the reference corpus)
        run: swift test --skip CorpusTests

      - name: Fuzz the engine (two minutes per image)
        run: |
          scripts/fuzz.sh Tests/Fixtures/mini.img 120
          scripts/fuzz.sh Tests/Fixtures/mini-attrlist.img 120
